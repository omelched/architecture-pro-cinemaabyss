[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "event-handler"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "aiokafka"]

[tool.setuptools.packages.find]
include = ["event_handler*"]
exclude = ["tmp*"]


[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.svg", "*.ico", "*.mo"]